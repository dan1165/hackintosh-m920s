name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package & publish EFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate config
        run: |
          curl -sSL -o oc.zip \
            "https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.8/OpenCore-1.0.8-RELEASE.zip"
          unzip -q oc.zip -d oc
          cp "$(find oc -name 'ocvalidate.linux' | head -1)" ./ocvalidate
          chmod +x ./ocvalidate
          ./ocvalidate EFI/OC/config.plist

      - name: Package
        run: |
          V="${{ github.ref_name }}"
          zip -qr "ThinkCentre-M920s-${V}.zip" \
            EFI docs PreInstall PostInstall scripts \
            README.md CHANGELOG.md LICENSE
          ls -lh ThinkCentre-M920s-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" ThinkCentre-M920s-*.zip \
            --title "${{ github.ref_name }}" --generate-notes
