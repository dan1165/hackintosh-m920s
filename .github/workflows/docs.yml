name: Docs & scripts

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - 'PreInstall/**'
      - 'PostInstall/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'PreInstall/**'
  workflow_dispatch:

jobs:
  markdown-links:
    name: Markdown relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links resolve
        run: ./scripts/check-links.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shopt -s nullglob
          files=(PreInstall/*.sh PostInstall/*.sh)
          # skip vendored upstream scripts (we don't own their style)
          sel=()
          for f in "${files[@]}"; do
            case "$f" in */ResourceConverter.sh) continue;; esac
            sel+=("$f")
          done
          if [ ${#sel[@]} -eq 0 ]; then echo "no scripts to lint"; exit 0; fi
          shellcheck --severity=warning "${sel[@]}"
