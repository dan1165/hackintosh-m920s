name: Docs & scripts

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - 'PreInstall/**'
      - 'PostInstall/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'PreInstall/**'
  workflow_dispatch:

jobs:
  markdown-links:
    name: Markdown relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links resolve
        run: |
          python3 - <<'PY'
          import os, re, glob, sys
          bad = 0
          for f in glob.glob('**/*.md', recursive=True):
              d = os.path.dirname(f)
              for m in re.finditer(r'\]\(([^)]+)\)', open(f, encoding='utf-8').read()):
                  t = m.group(1)
                  if t.startswith(('http', '#', 'mailto:')):
                      continue
                  t = t.split('#')[0]
                  if not t:
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(d, t))):
                      print(f"::error file={f}::broken link: {t}")
                      bad += 1
          print("broken links:", bad)
          sys.exit(1 if bad else 0)
          PY

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shopt -s nullglob
          files=(PreInstall/*.sh PostInstall/*.sh)
          # skip vendored upstream scripts (we don't own their style)
          sel=()
          for f in "${files[@]}"; do
            case "$f" in */ResourceConverter.sh) continue;; esac
            sel+=("$f")
          done
          if [ ${#sel[@]} -eq 0 ]; then echo "no scripts to lint"; exit 0; fi
          shellcheck --severity=warning "${sel[@]}"
