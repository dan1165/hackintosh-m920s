name: Bug report
description: Something in the build broke or boots incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please read `docs/TROUBLESHOOTING.md` first and attach the items below.
  - type: input
    id: commit
    attributes:
      label: Repo commit
      description: "`git rev-parse --short HEAD`"
      placeholder: "f926cc1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "`sw_vers` (or 'installer' if it fails before macOS boots)"
      placeholder: "14.6"
    validations:
      required: true
  - type: textarea
    id: ocvalidate
    attributes:
      label: ocvalidate output
      description: Output of `./PostInstall/ocvalidate.linux EFI/OC/config.plist`
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual, and the last few verbose lines / a photo of the screen
    validations:
      required: true
  - type: textarea
    id: changed
    attributes:
      label: What did you change?
      description: Exact keys/files touched since it last worked
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I read docs/TROUBLESHOOTING.md
          required: true
        - label: I changed only one thing and re-validated with ocvalidate
          required: true
